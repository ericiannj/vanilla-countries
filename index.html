<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Countries Atlas — Explore the World</title>
    <meta name="description" content="An interactive world atlas. Click any country to explore its details, mark countries as known, and compare two countries side by side." />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <!-- Header — floats over the map with gradient fade -->
    <header class="app-header">
      <div class="logo">
        <div class="logo-icon">🌍</div>
        <div>
          <div class="logo-text">Countries Atlas</div>
          <div class="logo-sub">Explore the world</div>
        </div>
      </div>
      <div class="known-counter" id="knownCounterWidget" aria-label="Known countries counter">
        <div class="known-dot" aria-hidden="true"></div>
        <span class="known-label">Known</span>
        <span class="known-num" id="knownCount">0</span>
        <span class="known-label">/ 195</span>
        <button class="known-reset" id="knownReset" aria-label="Reset all known countries" hidden>×</button>
      </div>
    </header>
    <!-- Map — full 100vw × 100vh hero layer -->
    <div class="map-area">
      <div class="map-container" id="mapContainer">
        <!-- SVG world map injected via loadMap() in main.js -->
      </div>
      <!-- Hint shown when no country is selected -->
      <p class="map-hint" id="mapHint" aria-live="polite">
        Click any country to explore
      </p>
    </div>
    <!-- Detail Card — fixed floating, top-right -->
    <aside class="detail-card" id="detailCard" hidden aria-label="Country details" aria-live="polite" aria-atomic="true">
      <div class="card-flag-area">
        <span class="card-flag" id="cardFlag" aria-hidden="true"></span>
        <div class="card-names">
          <div class="card-common" id="cardCommon"></div>
          <div class="card-official" id="cardOfficial"></div>
        </div>
        <button class="card-close" id="cardClose" aria-label="Close detail card">✕</button>
      </div>
      <div class="card-body">
        <div class="card-grid" id="cardGrid"></div>
        <div class="card-divider"></div>
        <span class="chip-label">Borders</span>
        <div class="card-chips" id="cardChips"></div>
        <div class="card-actions">
          <button class="btn btn-known" id="btnKnown" aria-pressed="false">Mark as Known</button>
          <button class="btn btn-compare" id="btnCompare" aria-pressed="false">+ Compare</button>
        </div>
      </div>
    </aside>
    <!-- Comparison Panel — slides above the bar when countries are queued -->
    <section class="comparison-panel" id="comparisonPanel" hidden aria-label="Country comparison">
      <div class="comparison-panel-header">
        <span class="comparison-panel-title">Comparison</span>
        <button class="comparison-clear" id="comparisonClear" aria-label="Clear comparison">Clear all</button>
      </div>
      <div class="comparison-cards" id="comparisonCards"></div>
    </section>
    <!-- Map controls — zoom/pan, floating bottom-left -->
    <div class="map-controls" id="mapControls" aria-label="Map navigation controls">
      <button class="map-ctrl-btn" id="mapZoomIn" aria-label="Zoom in" title="Zoom in">+</button>
      <button class="map-ctrl-btn" id="mapZoomOut" aria-label="Zoom out" title="Zoom out">−</button>
      <button class="map-ctrl-btn" id="mapReset" aria-label="Reset view" title="Reset view">⊙</button>
    </div>
    <!-- Comparator Bar — fixed at the bottom -->
    <div class="comparator-bar" id="comparatorBar" aria-label="Country comparator">
      <span class="comp-label">Compare</span>
      <div class="comp-slots">
        <div class="comp-slot comp-slot--empty" id="comparatorSlot1" aria-label="First comparison slot">
          <span class="comp-empty-text">+ Add a country</span>
        </div>
        <div class="comp-vs" aria-hidden="true">vs</div>
        <div class="comp-slot comp-slot--empty" id="comparatorSlot2" aria-label="Second comparison slot">
          <span class="comp-empty-text">+ Add a country</span>
        </div>
      </div>
      <button class="comp-clear-bar" id="compClearBar" aria-label="Clear comparison" hidden>Clear</button>
    </div>
    <script src="main.js"></script>
  </body>
</html>
